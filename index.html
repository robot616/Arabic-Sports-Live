<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Arabic Sports Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- مكتبة JW Player -->
    <script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            color: #fff;
        }

        /* تخطيط الصفحة: المحتوى يميناً والقائمة يساراً */
        .layout {
            display: flex;
            flex-direction: row; /* في نظام RTL، العنصر الأول سيكون على اليمين والثاني على اليسار */
            height: 100vh;
            width: 100%;
        }

        /* ------------------------------------------- */
        /* تصميم منطقة العرض الرئيسية (اليمين) */
        /* ------------------------------------------- */
        .main-area {
            flex: 1;
            position: relative;
            /* صورة ملعب تعبر عن الرياضة */
            background: url('https://images.unsplash.com/photo-1518605368461-1ee7c5320d73?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7); /* غطاء داكن لإبراز النص */
            z-index: 1;
        }

        .welcome-screen {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .welcome-title {
            color: #1dcf60;
            font-size: 75px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 5px 25px rgba(29, 207, 96, 0.4);
        }

        .welcome-subtitle {
            color: #ddd;
            font-size: 20px;
            margin-top: 15px;
        }

        #player-wrapper {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
            background: #000;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* ------------------------------------------- */
        /* تصميم القائمة الجانبية (الشمال) */
        /* ------------------------------------------- */
        .sidebar {
            width: 320px;
            background-color: #111;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #2a2a2a; /* تم التعديل لتناسب وضعها على اليسار */
            z-index: 20;
        }

        /* شريط البحث وزر الرئيسية */
        .search-container {
            display: flex;
            flex-direction: row; /* ترتيب العناصر: البحث يميناً والهوم يساراً */
            padding: 15px;
            gap: 10px;
            background-color: #161616;
            border-bottom: 1px solid #2a2a2a;
        }

        .search-box {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .search-box:focus {
            border-color: #1dcf60;
        }

        .home-btn {
            background: #ff4d4d;
            border: none;
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .home-btn:hover {
            background: #ff1a1a;
        }

        .home-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* حاوية القنوات */
        .channels-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .channels-list-container::-webkit-scrollbar { width: 6px; }
        .channels-list-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .category-header {
            background: #000;
            border: 1px solid #333;
            color: #1dcf60;
            text-align: center;
            padding: 10px;
            margin-top: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
        }
        
        .category-header:first-child { margin-top: 0; }

        .channel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: transparent;
            border-bottom: 1px solid #222;
            cursor: pointer;
            transition: all 0.2s;
        }

        .channel-item:hover, .channel-item.active {
            background: #1a1a1a;
            border-right: 3px solid #1dcf60;
        }

        .channel-name {
            font-size: 14px;
            font-weight: 600;
            color: #eee;
        }

        .channel-tag {
            background: #222;
            color: #888;
            font-size: 10px;
            padding: 4px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>

        let playerInstance = null;

        // دالة بناء القائمة الجانبية
        function buildSidebar(filterText = "") {
            const sidebarContainer = document.getElementById('sidebar-list');
            sidebarContainer.innerHTML = "";

            channelGroups.forEach((group) => {
                const filteredChannels = group.channels.filter(ch => 
                    ch.title.toLowerCase().includes(filterText.toLowerCase())
                );

                if (filteredChannels.length > 0) {
                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.innerText = group.groupName;
                    sidebarContainer.appendChild(header);

                    filteredChannels.forEach((ch) => {
                        const channelItem = document.createElement('div');
                        channelItem.className = 'channel-item';
                        channelItem.onclick = () => playChannel(ch, channelItem);
                        
                        channelItem.innerHTML = `
                            <span class="channel-name">${ch.title}</span>
                            <span class="channel-tag">${ch.type}</span>
                        `;
                        
                        sidebarContainer.appendChild(channelItem);
                    });
                }
            });
        }

        // دالة التشغيل التي تم تعديلها لتجنب أخطاء قائمة التشغيل (Error 102630 Fix)
        function playChannel(channelConfig, element) {
            // إظهار المشغل وإخفاء الخلفية
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('player-wrapper').style.display = 'block';

            // تفعيل اللون على القناة المختارة
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            // إعداد مصدر الفيديو
            const sourceItem = {
                file: channelConfig.file,
                type: channelConfig.type.toLowerCase()
            };
            
            // إضافة مفاتيح الـ DRM إن وجدت
            if(channelConfig.drm) {
                sourceItem.drm = channelConfig.drm;
            }

            // تشغيل المشغل
            if (!playerInstance) {
                playerInstance = jwplayer("player").setup({
                    playlist: [sourceItem],
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    stretching: "exactfit",
                    cast: {}
                });
            } else {
                playerInstance.load([sourceItem]);
                playerInstance.play();
            }
        }

        // العودة للرئيسية وإغلاق البث
        function goHome() {
            if(playerInstance) {
                playerInstance.stop();
            }
            document.getElementById('player-wrapper').style.display = 'none';
            document.getElementById('welcome-screen').style.display = 'block';
            
            document.getElementById('search-input').value = "";
            buildSidebar();
        }

        // دالة البحث
        function filterChannels() {
            const val = document.getElementById('search-input').value;
            buildSidebar(val);
        }

        // البناء الأولي للقائمة
        buildSidebar();
