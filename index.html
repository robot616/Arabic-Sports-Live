    <style>
        /* إعدادات الصفحة الأساسية */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #player { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1;
        }

        /* --------------------------------------------------- */
        /* تصميم الشاشة الرئيسية (Home Screen) */
        /* --------------------------------------------------- */
        #home-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        /* الشريط العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #1a1a1a;
            border-bottom: 2px solid #1dcf60;
        }

        /* عنوان الموقع المميز */
        .main-title {
            background: #1dcf60;
            color: #000;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 1px;
        }

        /* أدوات البحث وزر الهوم على اليسار */
        .left-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2b2b2b;
            color: #fff;
            outline: none;
            width: 250px;
            font-family: inherit;
        }
        .search-box:focus {
            border-color: #1dcf60;
        }

        .home-btn {
            padding: 10px 20px;
            background: #ff4d4d;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }
        .home-btn:hover {
            background: #ff1a1a;
        }

        /* شبكة القنوات */
        .channels-container {
            padding: 25px;
            overflow-y: auto;
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .channel-card {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .channel-card:hover {
            background: #3a3a3a;
            border-color: #1dcf60;
            transform: translateY(-3px);
        }

        /* --------------------------------------------------- */
        /* التعديلات البصرية لأيقونات المشغل */
        /* --------------------------------------------------- */

        // إعداد البلاير
        const playerInstance = jwplayer("player").setup({
            playlist: channelsData,
            width: "100%",
            height: "100%",
            autostart: false, // لا تعمل تلقائياً حتى يختار المستخدم من الشاشة الرئيسية
            stretching: "uniform"
        });

        // دوال الشاشة الرئيسية والبحث
        const listContainer = document.getElementById('channels-list');
        const homeScreen = document.getElementById('home-screen');
        const searchInput = document.getElementById('search');

        function renderChannels(filterText = "") {
            listContainer.innerHTML = "";
            channelsData.forEach((ch, index) => {
                if (ch.title.toLowerCase().includes(filterText.toLowerCase())) {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.innerText = ch.title;
                    card.onclick = () => playChannel(index);
                    listContainer.appendChild(card);
                }
            });
        }

        // رسم القنوات لأول مرة
        renderChannels();

        function filterChannels() {
            renderChannels(searchInput.value);
        }

        // تشغيل القناة المختارة وإخفاء الشاشة الرئيسية
        function playChannel(index) {
            homeScreen.style.display = 'none';
            playerInstance.playlistItem(index);
            playerInstance.play();
        }

        // إيقاف البث والعودة للشاشة الرئيسية
        function goHome() {
            playerInstance.stop(); // تمنع أي بث شغال حالياً
            homeScreen.style.display = 'flex';
            searchInput.value = "";
            renderChannels(); 
        }

        // إضافة أزرار مخصصة داخل شريط تحكم المشغل (Home & Stretch)

            playerInstance.addButton(
                homeIcon,
                "الرئيسية",
                function() {
                    goHome();
                },
                "home-button"
            );

            // 2. زر التوسيع/التضييق
            let isStretched = false;
            const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";
            playerInstance.addButton(
                diagonalCutArrow, 
                "توسيع/تضييق الصورة", 
                function() {
                    if (!isStretched) {
                        playerInstance.setConfig({ stretching: "exactfit" }); 
                        isStretched = true;
                    } else {
                        playerInstance.setConfig({ stretching: "uniform" });
                        isStretched = false;
                    }
                },
                "stretch-button"
            );
