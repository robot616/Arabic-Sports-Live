<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Arabic Sports Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            color: #fff;
        }

        /* تخطيط الصفحة: القائمة على اليسار والمحتوى على اليمين */
        .layout {
            display: flex;
            flex-direction: row-reverse; /* يجعل القائمة على اليسار في نظام RTL */
            height: 100vh;
            width: 100%;
        }

        /* ------------------------------------------- */
        /* تصميم القائمة الجانبية (Sidebar) */
        /* ------------------------------------------- */
        .sidebar {
            width: 320px;
            background-color: #111;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2a2a2a;
            z-index: 20;
        }

        /* شريط البحث وزر الرئيسية */
        .search-container {
            display: flex;
            padding: 15px;
            gap: 10px;
            background-color: #161616;
            border-bottom: 1px solid #2a2a2a;
        }

        .home-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .home-btn:hover {
            background: #333;
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        .search-box {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #aaa;
            padding: 8px 15px;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }

        .search-box:focus {
            border-color: #1dcf60;
            color: #fff;
        }

        /* حاوية القنوات */
        .channels-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        /* تصميم شريط التمرير */
        .channels-list-container::-webkit-scrollbar { width: 6px; }
        .channels-list-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        /* عنوان القسم (Category Header) */
        .category-header {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            margin-top: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .category-header:first-child { margin-top: 0; }

        /* زر القناة */
        .channel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: transparent;
            border-bottom: 1px solid #222;
            cursor: pointer;
            transition: all 0.2s;
        }

        .channel-item:hover, .channel-item.active {
            background: #1a1a1a;
        }

        .channel-name {
            font-size: 14px;
            font-weight: 600;
            color: #eee;
        }

        .channel-tag {
            background: #222;
            color: #888;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* ------------------------------------------- */
        /* تصميم منطقة العرض الرئيسية (Main Area) */
        /* ------------------------------------------- */
        .main-area {
            flex: 1;
            position: relative;
            background: url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* غطاء داكن للخلفية الرياضية */
        .main-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1;
        }

        /* شاشة الترحيب */
        .welcome-screen {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .welcome-title {
            color: #1dcf60; /* لون أخضر فاقع مطابق للتصميم */
            font-size: 70px;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(29, 207, 96, 0.3);
        }

        .welcome-subtitle {
            color: #ccc;
            font-size: 18px;
            margin-top: 15px;
        }

        /* حاوية مشغل الفيديو */
        #player-wrapper {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
            background: #000;
        }

        #player {
            width: 100%;
            height: 100%;
        }
        
        /* إخفاء الأيقونات الافتراضية غير المرغوب فيها في JW Player */
        .jw-icon-playlist, .jw-icon-next, .jw-related-btn { display: none !important; }
    </style>
</head>

            <div class="channels-list-container" id="sidebar-list">

                channels: [
                    { title: "Alkass 1", type: "HLS", file: "https://storage.googleapis.com/livealkass-eu/alkass1-p/main.m3u8" },
                    { title: "Alkass 2", type: "HLS", file: "https://storage.googleapis.com/livealkass-eu/alkass2-p/main.m3u8" },
                    { title: "Alkass 3", type: "HLS", file: "https://storage.googleapis.com/livealkass-eu/alkass3-p/main.m3u8" },
                    { title: "Alkass 4", type: "HLS", file: "https://storage.googleapis.com/livealkass-eu/alkass4-p/main.m3u8" },

        // استخراج قائمة خطية للمشغل وبناء واجهة المستخدم
        let flatPlaylist = [];
        let globalIndex = 0;
        
        function buildSidebar(filterText = "") {
            const sidebarContainer = document.getElementById('sidebar-list');
            sidebarContainer.innerHTML = "";
            flatPlaylist = [];
            globalIndex = 0;

            channelGroups.forEach(group => {
                // تصفية القنوات بناءً على البحث
                const filteredChannels = group.channels.filter(ch => 
                    ch.title.toLowerCase().includes(filterText.toLowerCase())
                );

                if (filteredChannels.length > 0) {
                    // إضافة عنوان القسم
                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.innerText = group.groupName;
                    sidebarContainer.appendChild(header);

                    // إضافة قنوات القسم
                    filteredChannels.forEach(ch => {
                        const currentIndex = globalIndex; // حفظ الاندكس الحالي
                        
                        // تجهيز الكائن الخاص بالمشغل
                        const playerItem = {
                            title: ch.title,
                            file: ch.file,
                            type: ch.type.toLowerCase()
                        };
                        if (ch.drm) playerItem.drm = ch.drm;
                        flatPlaylist.push(playerItem);

                        // بناء زر القناة في القائمة
                        const channelItem = document.createElement('div');
                        channelItem.className = 'channel-item';
                        channelItem.onclick = () => playChannel(currentIndex, channelItem);
                        
                        channelItem.innerHTML = `
                            <span class="channel-name">${ch.title}</span>
                            <span class="channel-tag">${ch.type}</span>
                        `;
                        
                        sidebarContainer.appendChild(channelItem);
                        globalIndex++;
                    });
                }
            });

            // تحديث قائمة البلاير إذا تم فلترة القنوات
            if (playerInstance && flatPlaylist.length > 0) {
                playerInstance.load(flatPlaylist);
            }
        }

        // إعداد JW Player
        const playerInstance = jwplayer("player").setup({
            playlist: [], // سيتم تحميلها لاحقاً
            width: "100%",
            height: "100%",
            autostart: true,
            stretching: "exactfit",
            cast: {}
        });

        // دالة تشغيل القناة
        function playChannel(index, element) {
            // إظهار المشغل وإخفاء شاشة الترحيب
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('player-wrapper').style.display = 'block';

            // تفعيل اللون على القناة المختارة
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            // تشغيل القناة
            playerInstance.playlistItem(index);
        }

        // دالة العودة للرئيسية
        function goHome() {
            playerInstance.stop();
            document.getElementById('player-wrapper').style.display = 'none';
            document.getElementById('welcome-screen').style.display = 'block';
            
            // إعادة ضبط البحث
            document.getElementById('search-input').value = "";
            buildSidebar();
        }

        // دالة البحث
        function filterChannels() {
            const val = document.getElementById('search-input').value;
            buildSidebar(val);
        }

        // البناء الأولي للقائمة
        buildSidebar();
    </script>
</body>
</html>
